<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEEB Admin Login</title><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh;background:#061b2b}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(430px,100%);background:#fff;border-radius:18px;padding:34px;box-shadow:0 20px 60px rgba(0,0,0,.3)}.login-logo{text-align:center;color:#c89b52;font-size:34px;font-weight:700;margin-bottom:8px}.login-card h1{text-align:center;margin:0 0 8px}.login-card .notes{text-align:center;margin-bottom:25px}.login-card label{display:block;font-weight:600;margin:14px 0 7px}.login-card input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #ddd;border-radius:9px;font:inherit}.login-error{display:none;margin-top:14px;padding:12px;border-radius:9px;background:#fff0f0;color:#a12626}.login-card button{width:100%;margin-top:20px}.back-store{display:block;text-align:center;margin-top:18px;color:#555}</style></head><body><main class="login-wrap"><section class="login-card"><div class="login-logo">طِيب</div><div class="eyebrow" style="text-align:center">TEEB PERFUMES</div><h1>Admin Login</h1><p class="notes">Sign in to manage customer orders.</p><form id="loginForm"><label for="email">Email</label><input id="email" type="email" value="perfumesteeb@gmail.com" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="btn btn-primary" id="loginButton" type="submit">SIGN IN</button><div id="loginError" class="login-error" role="alert"></div></form><a class="back-store" href="index.html">← Back to store</a></section></main><script src="admin-auth.js"></script><script>const form=document.getElementById('loginForm'),err=document.getElementById('loginError'),btn=document.getElementById('loginButton');form.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';btn.disabled=true;btn.textContent='SIGNING IN...';try{const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error_description||data.msg||'Invalid email or password.');if(String(data.user?.email||email).toLowerCase()!==ADMIN_EMAIL)throw new Error('This account is not authorized for the admin dashboard.');saveSession(data);location.href='admin.html';}catch(x){err.textContent=x.message;err.style.display='block';btn.disabled=false;btn.textContent='SIGN IN';}});</script></body></html>
