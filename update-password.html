<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEEB Admin — Set New Password</title><style>body{margin:0;min-height:100vh;background:#061b2b;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(430px,100%);background:#fff;border-radius:18px;padding:32px;box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.3)}.logo{text-align:center;color:#c89b52;font-size:28px;font-weight:700;margin-bottom:6px}.eyebrow{text-align:center;color:#a27a3e;letter-spacing:5px;font-weight:700;font-size:13px;margin-bottom:18px}.card h1{text-align:center;color:#061b2b;margin:0 0 8px}.notes{text-align:center;color:#667085;margin-bottom:24px}.card label{display:block;font-weight:600;color:#182230;margin:14px 0 7px}.card input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #ddd;border-radius:9px;font:inherit}.btn{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#061b2b;color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6}.message{display:none;margin-top:14px;padding:12px;border-radius:9px}.error{background:#fff0f0;color:#a12626}.success{background:#eefaf1;color:#176b35}.back{display:block;text-align:center;margin-top:18px;color:#555;text-decoration:none}</style></head><body><main class="card"><div class="logo">طِيب</div><div class="eyebrow">TEEB PERFUMES</div><h1>Set New Password</h1><p class="notes">Create a new password for the admin account.</p><form id="form"><label for="password">New Password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Confirm Password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button class="btn" id="button" type="submit">UPDATE PASSWORD</button><div id="error" class="message error"></div><div id="success" class="message success">Password updated successfully. You can now sign in to the admin dashboard.</div></form><a class="back" href="admin-login.html">← Back to Admin Login</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://qjcghudjcagpbywmtlnp.supabase.co';const SUPABASE_KEY='sb_publishable_032jnom6xlHAABnfHL9a6Q_4i1wzXNs';const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const form=document.getElementById('form'),button=document.getElementById('button'),error=document.getElementById('error'),success=document.getElementById('success');function showError(message){error.textContent=message;error.style.display='block';success.style.display='none'}supabase.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&!session)showError('This reset link is invalid or expired. Please request a new reset email.')});form.addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';success.style.display='none';const password=document.getElementById('password').value;const confirm=document.getElementById('confirm').value;if(password!==confirm)return showError('Passwords do not match.');if(password.length<8)return showError('Password must be at least 8 characters.');button.disabled=true;button.textContent='UPDATING...';try{const {data,error:err}=await supabase.auth.updateUser({password});if(err)throw err;if(!data?.user)throw new Error('Reset session is missing or expired.');success.style.display='block';form.reset();button.textContent='PASSWORD UPDATED';setTimeout(()=>{window.location.href='admin-login.html'},1800)}catch(err){showError(err.message||'Could not update password. Please request a new reset link.');button.disabled=false;button.textContent='UPDATE PASSWORD'}});</script></body></html>
