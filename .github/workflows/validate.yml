name: Validate storefront

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check catalog.js
          node --check app.js
          node --check checkout.js
          node --check api/order.js
          node --check admin-auth.js
          node --check admin-products.js
          node --check admin-orders.js
          node --check cart-message.js
          node --check collection-filter.js
          node --check image-fix.js
          node --check toast.js
